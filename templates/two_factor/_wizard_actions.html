{% load i18n %}
<div class="form-footer d-flex align-items-center gap-2">
    {% if wizard.steps.prev %}<button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}" class="btn">{% trans "Back" %}</button>{% endif %}
    {% if cancel_url %}<a href="{{ cancel_url }}" class="btn">{% trans "Cancel" %}</a>{% endif %}
    <button type="submit" class="btn btn-primary ms-auto">{% trans "Next" %}</button>
</div>
