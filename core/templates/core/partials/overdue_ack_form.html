<form hx-post="{% url 'core:ticket_acknowledge_overdue' ticket.pk %}" hx-target="#overdue-section" hx-swap="innerHTML" class="card card-sm">
  <div class="card-body">
    {% csrf_token %}
    {% if ack_error %}<div class="text-danger mb-2">{{ ack_error }}</div>{% endif %}
    <label class="form-label">What is being done about this overdue ticket? (required)</label>
    <textarea name="note" rows="3" required class="form-control mb-2"></textarea>
    <button type="submit" class="btn btn-danger btn-sm">Acknowledge</button>
    <button type="button" hx-get="{% url 'core:ticket_acknowledge_overdue' ticket.pk %}" hx-target="#overdue-section" hx-swap="outerHTML" class="btn btn-sm">Cancel</button>
  </div>
</form>
