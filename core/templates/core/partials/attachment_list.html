{% load mb_tabler %}
{% if attachments %}
<ul class="list-unstyled mt-1 mb-0 small">
    {% for att in attachments %}
    <li>{% ticon 'paperclip' 'icon-sm' %} <a href="{% url 'core:attachment_download' att.pk %}">{{ att.original_filename }}</a> <span class="text-secondary">({{ att.size_display }})</span></li>
    {% endfor %}
</ul>
{% endif %}
