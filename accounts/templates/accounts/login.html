{% extends "core/base_tabler_focus.html" %}
{% block title %}Sign in - Murphy's Bench{% endblock %}
{% block content %}
<h2 class="h2 text-center mb-4">Sign in</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label><input type="text" name="username" id="id_username" class="form-control" autofocus required autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label><input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password"></div>
    <div class="form-footer"><button type="submit" class="btn btn-primary w-100">Sign in</button></div>
</form>
{% endblock %}
{% block below_card %}<div class="text-center text-secondary mt-3 small">{{ site_settings.company_name|default:"Murphy's Bench" }}. Internal use only.</div>{% endblock %}
